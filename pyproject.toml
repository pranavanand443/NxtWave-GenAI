[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "self-evaluating-lesson-generator"
version = "0.1.0"
description = "A finite LangGraph workflow that generates, evaluates, and revises lessons."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "langchain-google-genai>=4.0,<5.0",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[project.scripts]
lesson-generator = "lesson_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp -p no:cacheprovider"
testpaths = ["tests"]
markers = ["live: explicitly enabled test that makes a real model API call"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache", ".uv-python", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
